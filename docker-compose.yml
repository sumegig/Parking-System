version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: parking_db
    environment:
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_password
      POSTGRES_DB: parking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_user -d parking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: parking_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://parking_user:parking_password@db:5432/parking_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: